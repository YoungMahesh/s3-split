services:
  sS3Split:
    image: s3-split:${TAG:-0}
    build:
      context: .
      dockerfile: Dockerfile
    # always build the image locally and skip remote registry pull attempts
    pull_policy: build
    container_name: cS3Split
    restart: unless-stopped
    env_file:
      - .env.docker
    networks:
      - s3-split_net

networks:
  s3-split_net:
    name: s3-split_net
    driver: bridge
